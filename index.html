<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }
        .wrapper {
            width: 100%;
        }
        .stats {
            font-size: 24px;
            font-weight: 700;
            text-align: center;
        }
        .grid {
            display: flex;
            flex-wrap: wrap;
            width: 720px;
            margin: 20px auto;
        }
        .cell {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 140px;
            height: 140px;
            margin: 8px;
            border: 3px solid #333;
            background: #3a6ea5;
            color: #fff;
            font-size: 22px;
            font-weight: 700;
            cursor: pointer;
            user-select: none;
        }
        .cell.on {
            background: #d97706;
            color: #222;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="stats">
            <p>Сумма значений выделенных ячеек: <span id="s">0</span></p>
            <p>Количество выделенных ячеек: <span id="c">0</span></p>
        </div>
        <div class="grid">
            <div class="cell">1</div>
            <div class="cell">2</div>
            <div class="cell">3</div>
            <div class="cell">4</div>
            <div class="cell">5</div>
            <div class="cell">6</div>
            <div class="cell">7</div>
            <div class="cell">8</div>
            <div class="cell">9</div>
            <div class="cell">10</div>
            <div class="cell">11</div>
            <div class="cell">12</div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
